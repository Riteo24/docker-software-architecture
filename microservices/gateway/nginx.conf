events {}
http {
    # Safe retries: NGINX does not retry an already sent POST as non-idempotent.
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    server {
        listen 80;
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
        location /catalog/ {
            proxy_pass http://catalog:5000/;
        }
        # These two APIs already include /users and /orders in their paths.
        location = /users/openapi.json {
            proxy_pass http://users:5000/openapi.json;
        }
        location = /orders/openapi.json {
            proxy_pass http://orders:5000/openapi.json;
        }
        location /users/ {
            proxy_pass http://users:5000;
        }
        location = /orders {
            proxy_pass http://orders:5000/orders;
        }
        location /orders/ {
            proxy_pass http://orders:5000;
        }
        location / {
            return 404;
        }
    }
}
