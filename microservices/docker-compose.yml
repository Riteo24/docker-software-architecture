name: architecture-microservices
services:
  catalog:
    build: ./services/catalog
    environment:
      PORT: '5000'
    networks:
    - ms-net
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health',
        timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    restart: on-failure:5
  users:
    build: ./services/users
    environment:
      PORT: '5000'
    networks:
    - ms-net
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health',
        timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    restart: on-failure:5
  orders:
    build: ./services/orders
    environment:
      PORT: '5000'
    networks:
    - ms-net
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health',
        timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    restart: on-failure:5
  gateway:
    image: nginx:1.28-alpine
    ports:
    - ${GATEWAY_PORT:-8080}:80
    volumes:
    - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
    - ms-net
    depends_on:
      catalog:
        condition: service_healthy
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O - http://127.0.0.1/health >/dev/null
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure:5
networks:
  ms-net:
    driver: bridge
