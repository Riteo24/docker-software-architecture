name: architecture-event-driven
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.12
    environment:
      ZOOKEEPER_CLIENT_PORT: '2181'
      ZOOKEEPER_TICK_TIME: '2000'
    healthcheck:
      test:
      - CMD-SHELL
      - cub zk-ready localhost:2181 10 3 1
      interval: 10s
      timeout: 15s
      retries: 20
    volumes:
    - zk-data:/var/lib/zookeeper/data
    - zk-log:/var/lib/zookeeper/log
    restart: unless-stopped
  kafka:
    image: confluentinc/cp-kafka:7.7.12
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: '1'
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    volumes:
    - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
  init-topics:
    image: confluentinc/cp-kafka:7.7.12
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic
      orders.events --partitions 1 --replication-factor 1
    restart: 'no'
  orders:
    build: .
    environment:
      PORT: '5002'
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: orders.events
    depends_on:
      init-topics:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
    - ${PORT:-5002}:5002
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5002/health',
        timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
  billing:
    build: .
    environment:
      PORT: '5002'
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: orders.events
    depends_on:
      init-topics:
        condition: service_completed_successfully
    restart: on-failure:5
    command:
    - python
    - -m
    - services.billing.main
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - shared.check_worker
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 40s
  notifications:
    build: .
    environment:
      PORT: '5002'
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: orders.events
    depends_on:
      init-topics:
        condition: service_completed_successfully
    restart: on-failure:5
    command:
    - python
    - -m
    - services.notifications.main
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - shared.check_worker
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 40s
volumes:
  zk-data: {}
  zk-log: {}
  kafka-data: {}
